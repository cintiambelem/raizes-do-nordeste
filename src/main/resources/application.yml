spring:
  application:
    name: raizes-do-nordeste-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/raizes;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:raizes-do-nordeste-development-secret-key-minimum-256-bits}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
