$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email":"gerente@raizes.com","senha":"Senha@123"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 gerente', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('tokenGerente', pm.response.json().accessToken);
order: 3000
